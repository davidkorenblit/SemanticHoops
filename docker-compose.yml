# =============================================================================
# Semantic Sport-Tech — Docker Compose (CPU Version - Fixed)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Qdrant Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: sport_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    # הסרנו את ה-healthcheck כי הוא נוטה להיכשל בגלל חוסר ב-curl בתוך ה-image

  # ---------------------------------------------------------------------------
  # Sport-Tech Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sport_api
    restart: unless-stopped
    depends_on:
      - qdrant # תלות רגילה ללא בדיקת בריאות חוסמת
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      - ./src:/app/src
      - .:/app
      - ./data/logs:/app/data/logs

volumes:
  qdrant_storage:
    driver: local