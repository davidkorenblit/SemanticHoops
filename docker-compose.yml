services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: sport_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sport_api
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
    volumes:
      - .:/app  # מיפוי אחד שכולל הכל (src, scripts, data, logs)

volumes:
  qdrant_storage:
    driver: local